<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勤務報告">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>勤務報告</title>
</head>
<body>
<header class="top">
  <button class="nav" id="prevMonth" aria-label="前の月">‹</button>
  <h1 id="monthTitle"></h1>
  <button class="nav" id="nextMonth" aria-label="次の月">›</button>
</header>

<main>
  <!-- 記録 -->
  <section id="tab-list" class="tab active">
    <div class="summary" id="listSummary"></div>
    <ul class="days" id="dayList"></ul>
  </section>

  <!-- 報告 -->
  <section id="tab-report" class="tab">
    <div class="card">
      <h2>報告文</h2>
      <textarea id="reportText" rows="14" readonly></textarea>
      <div class="btns">
        <button class="primary" id="copyReport">コピー</button>
        <button id="shareReport">LINEなどで共有</button>
      </div>
    </div>
    <div class="card">
      <h2>領収書</h2>
      <p class="muted" id="receiptCount"></p>
      <div class="thumbs" id="monthReceipts"></div>
      <div class="btns">
        <button class="primary" id="shareReceipts">領収書をまとめて共有</button>
      </div>
      <p class="muted small">共有画面でLINEを選ぶと、画像をまとめて送れます。</p>
    </div>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" class="tab">
    <div class="card">
      <h2>いつもの勤務時間</h2>
      <div class="grid3">
        <label>出勤<input type="time" id="setStart"></label>
        <label>退勤<input type="time" id="setEnd"></label>
        <label>休憩(分)<input type="number" id="setBreak" inputmode="numeric" min="0" step="5"></label>
      </div>
    </div>
    <div class="card">
      <h2>よく使う駐車場</h2>
      <ul class="plist" id="parkingList"></ul>
      <div class="grid2">
        <label>名前<input type="text" id="newParkName" placeholder="例: 駅前P"></label>
        <label>金額(円)<input type="number" id="newParkFee" inputmode="numeric" min="0"></label>
      </div>
      <div class="btns"><button id="addParking">追加</button></div>
    </div>
    <div class="card">
      <h2>よく使う電車の区間</h2>
      <ul class="plist" id="trainList"></ul>
      <div class="grid2">
        <label>区間<input type="text" id="newTrainRoute" placeholder="例: A駅-B駅 往復"></label>
        <label>運賃(円)<input type="number" id="newTrainFee" inputmode="numeric" min="0"></label>
      </div>
      <div class="btns"><button id="addTrain">追加</button></div>
    </div>
    <div class="card">
      <h2>ガソリン代</h2>
      <label>清算方法
        <select id="setGasMode">
          <option value="none">記録しない</option>
          <option value="distance">走行距離 × 単価</option>
          <option value="actual">給油した実費</option>
        </select>
      </label>
      <label id="gasRateWrap">1kmあたりの単価(円)<input type="number" id="setGasRate" inputmode="decimal" min="0" step="0.1"></label>
    </div>
    <div class="card">
      <h2>バックアップ</h2>
      <p class="muted small">データはこのスマホの中だけに保存されています。機種変更の前や、ときどき書き出しておくと安心です。</p>
      <div class="btns">
        <button id="exportData">書き出し</button>
        <button id="importData">読み込み</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="list" class="active">記録</button>
  <button data-tab="report">報告</button>
  <button data-tab="settings">設定</button>
</nav>

<!-- 1日の入力 -->
<dialog id="editor">
  <form method="dialog" id="editForm">
    <h2 id="editDate"></h2>
    <div class="grid3">
      <label>出勤<input type="time" id="fStart" required></label>
      <label>退勤<input type="time" id="fEnd" step="300" required></label>
      <label>休憩(分)<input type="number" id="fBreak" inputmode="numeric" min="0" step="5"></label>
    </div>
    <label>退勤時刻をえらぶ</label>
    <div class="chips" id="endHours"></div>
    <div class="chips mins" id="endMins"></div>
    <p class="worked" id="fWorked"></p>

    <label>交通手段</label>
    <div class="seg" id="modeSeg">
      <button type="button" data-mode="car">🚗 車</button>
      <button type="button" data-mode="train">🚃 電車</button>
    </div>

    <div id="carFields">
    <fieldset>
      <legend>駐車場</legend>
      <div class="chips" id="parkChips"></div>
      <div class="grid2">
        <label>名前<input type="text" id="fParkName" placeholder="なし"></label>
        <label>金額(円)<input type="number" id="fParkFee" inputmode="numeric" min="0"></label>
      </div>
    </fieldset>

    <fieldset id="gasDistance" hidden>
      <legend>ガソリン代（走行距離）</legend>
      <label>走行距離(km)<input type="number" id="fKm" inputmode="decimal" min="0" step="0.1"></label>
      <p class="muted small" id="fKmFee"></p>
    </fieldset>
    <fieldset id="gasActual" hidden>
      <legend>ガソリン代（給油）</legend>
      <label>給油額(円)<input type="number" id="fGas" inputmode="numeric" min="0"></label>
    </fieldset>
    </div>

    <div id="trainFields" hidden>
    <fieldset>
      <legend>電車</legend>
      <div class="chips" id="trainChips"></div>
      <div class="grid2">
        <label>区間<input type="text" id="fTrainRoute" placeholder="例: A駅-B駅 往復"></label>
        <label>運賃(円)<input type="number" id="fTrainFee" inputmode="numeric" min="0"></label>
      </div>
    </fieldset>
    </div>

    <fieldset>
      <legend>領収書</legend>
      <div class="thumbs" id="fReceipts"></div>
      <div class="btns tight">
        <button type="button" class="primary" id="takePhoto">📷 撮影</button>
        <button type="button" id="pickPhoto">アルバムから</button>
      </div>
      <input type="file" id="cameraFile" accept="image/*" capture="environment" hidden>
      <input type="file" id="receiptFile" accept="image/*" multiple hidden>
    </fieldset>

    <label>メモ<input type="text" id="fNote" placeholder="任意"></label>

    <div class="btns end">
      <button type="button" class="danger" id="deleteRec">削除</button>
      <span class="spacer"></span>
      <button type="button" id="cancelEdit">キャンセル</button>
      <button type="submit" class="primary" id="saveRec">保存</button>
    </div>
  </form>
</dialog>

<dialog id="viewer">
  <img id="viewerImg" alt="領収書">
  <form method="dialog"><button class="primary">閉じる</button></form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
